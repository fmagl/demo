version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: empik_postgres
    environment:
      POSTGRES_USER: coupon_user
      POSTGRES_PASSWORD: coupon_password
      POSTGRES_DB: coupon_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: