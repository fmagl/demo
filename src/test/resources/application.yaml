  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false 
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

coupon:
